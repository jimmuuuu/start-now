# v47 diagnostics + exact missing export + strict coverage gate
name: Exercise media coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-media-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build full ExerciseDB safe-match diagnostic
        run: node scripts/diagnose-exercise-media-v45.mjs

      - name: Verify safely mapped ExerciseDB GIF URLs
        run: node scripts/verify-safe-gifs-v45.mjs

      - name: Audit public-domain backup media
        run: node scripts/diagnose-free-db-v46.mjs

      - name: Export exact remaining exercise list
        run: node scripts/build-missing-exercise-media-v47.mjs

      - name: Commit diagnostic reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXERCISE_MEDIA_DIAGNOSTIC_V45.json EXERCISE_MEDIA_DIAGNOSTIC_V45.md EXERCISE_MEDIA_LOAD_CHECK_V45.json EXERCISE_MEDIA_LOAD_CHECK_V45.md EXERCISE_MEDIA_BACKUP_DIAGNOSTIC_V46.json EXERCISE_MEDIA_BACKUP_DIAGNOSTIC_V46.md missing-exercise-media.json
          if git diff --cached --quiet; then
            echo 'Diagnostics already current.'
          else
            git commit -m 'Generate exercise media diagnostics [skip ci]'
            git push origin HEAD
          fi

      - name: Require 100 percent working GIF coverage
        run: node scripts/assert-100-exercise-gif-coverage.mjs
