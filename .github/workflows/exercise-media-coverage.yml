# v45 diagnostic branch trigger
name: Exercise media coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-media-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build full safe-match diagnostic
        run: node scripts/diagnose-exercise-media-v45.mjs

      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXERCISE_MEDIA_DIAGNOSTIC_V45.json EXERCISE_MEDIA_DIAGNOSTIC_V45.md
          if git diff --cached --quiet; then
            echo 'Diagnostic already current.'
            exit 0
          fi
          git commit -m 'Generate exercise media diagnostic [skip ci]'
          git push origin HEAD
