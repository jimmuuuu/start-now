name: Navigation smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - NAVIGATION_SMOKE_STATUS.md
  pull_request:
    branches: [main]
    paths-ignore:
      - NAVIGATION_SMOKE_STATUS.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Check active JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            case "$file" in
              http://*|https://*)
                echo "Skipping external script $file"
                continue
                ;;
            esac
            echo "Checking $file"
            node --check "$file" || failed=1
          done < <(sed -n 's/.*<script src="\([^"?]*\).*/\1/p' index.html)
          exit "$failed"
      - name: Check exercise note persistence
        id: notes
        continue-on-error: true
        run: npm run test:notes
      - name: Check PWA readiness
        id: pwa
        continue-on-error: true
        run: npm run test:pwa
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run navigation smoke tests
        id: smoke
        continue-on-error: true
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-smoke-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record test result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.smoke.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          NOTES_OUTCOME: ${{ steps.notes.outcome }}
          PWA_OUTCOME: ${{ steps.pwa.outcome }}
          TEST_COMMIT: ${{ github.sha }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ] && [ "$SYNTAX_OUTCOME" = "success" ] && [ "$NOTES_OUTCOME" = "success" ] && [ "$PWA_OUTCOME" = "success" ]; then STATUS="PASS"; else STATUS="FAIL"; fi
          printf '# START/NOW Navigation Smoke Status\n\n- Status: **%s**\n- Tested commit: `%s`\n- Workflow run: `%s`\n- Syntax check: **%s**\n- Exercise notes: **%s**\n- PWA readiness: **%s**\n- Playwright: **%s**\n- Recorded: `%s`\n' "$STATUS" "$TEST_COMMIT" "$GITHUB_RUN_ID" "$SYNTAX_OUTCOME" "$NOTES_OUTCOME" "$PWA_OUTCOME" "$TEST_OUTCOME" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > NAVIGATION_SMOKE_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAVIGATION_SMOKE_STATUS.md
          git commit -m "test: record navigation smoke result [skip ci]" || true
          git push || true
      - name: Fail workflow when release gate fails
        if: steps.smoke.outcome != 'success' || steps.syntax.outcome != 'success' || steps.notes.outcome != 'success' || steps.pwa.outcome != 'success'
        run: exit 1
