<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>START/NOW Fitness</title>

  <script>
    (() => {
      const version = "start-now-schedule-editor-v10";
      if (localStorage.getItem("sn_runtime_version") === version) return;
      window.addEventListener("load", async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          localStorage.setItem("sn_runtime_version", version);
        } catch (error) {
          console.warn("START/NOW cache reset skipped", error);
        }
      }, { once: true });
    })();
  </script>

  <link rel="manifest" href="manifest.webmanifest?v=schedule-editor-v10" />
  <link rel="stylesheet" href="app.css?v=schedule-editor-v10" />
  <link rel="stylesheet" href="builder.css?v=schedule-editor-v10" />
  <link rel="stylesheet" href="progress.css?v=schedule-editor-v10" />
  <link rel="stylesheet" href="beginner-plan.css?v=schedule-editor-v10" />
  <link rel="stylesheet" href="active-plan.css?v=schedule-editor-v10" />

  <style>
    .sn-edit-schedule-card{width:100%;margin:12px 0 14px;padding:14px 16px;border:1px solid rgba(255,90,95,.4);border-radius:18px;background:linear-gradient(145deg,var(--surface),rgba(255,90,95,.07));color:var(--text);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left}
    .sn-edit-schedule-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--coral);color:#fff;font-size:20px;font-weight:900;box-shadow:0 8px 18px rgba(255,90,95,.22)}
    .sn-edit-schedule-copy strong{display:block;font-size:15px;margin-bottom:3px}.sn-edit-schedule-copy span{display:block;color:var(--muted);font-size:11px;line-height:1.35}.sn-edit-schedule-arrow{color:var(--coral);font-size:24px;font-weight:900}
    .sn-schedule-overlay{position:fixed;inset:0;z-index:5000;background:rgba(10,10,10,.58);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:14px}
    .sn-schedule-modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:28px 28px 20px 20px;box-shadow:0 26px 80px rgba(0,0,0,.32);padding:18px}
    .sn-schedule-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-bottom:12px}.sn-schedule-close,.sn-schedule-back{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:22px}.sn-schedule-kicker{text-align:center;color:var(--coral);font-size:11px;font-weight:900;letter-spacing:.1em}
    .sn-schedule-modal h1{margin:6px 0 8px;font-size:31px;line-height:1.05;letter-spacing:-1px}.sn-schedule-sub{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
    .sn-schedule-days,.sn-schedule-picker{display:grid;gap:9px}.sn-schedule-row,.sn-picker-row{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--text);text-align:left}.sn-schedule-row.has-workout{border-color:rgba(255,90,95,.28);background:linear-gradient(145deg,var(--surface),rgba(255,90,95,.04))}
    .sn-day-box{width:52px;height:52px;border-radius:14px;background:rgba(127,127,127,.1);display:grid;place-items:center;font-weight:900}.sn-row-copy strong,.sn-picker-copy strong{display:block;font-size:14px;margin-bottom:3px}.sn-row-copy span,.sn-picker-copy span{display:block;color:var(--muted);font-size:11px;line-height:1.35}.sn-change{color:var(--coral);font-size:12px;font-weight:900}.sn-picker-row.selected{border-color:var(--coral);box-shadow:0 0 0 2px rgba(255,90,95,.08)}.sn-picker-check{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:900}.sn-picker-row.selected .sn-picker-check{background:var(--coral);border-color:var(--coral)}
    .sn-schedule-actions{display:grid;grid-template-columns:.8fr 1.2fr;gap:9px;margin-top:14px}.sn-schedule-actions button{min-height:50px}.sn-schedule-note{margin:12px 0 0;padding:11px 12px;border-radius:14px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--muted);font-size:11px;line-height:1.4}
    @media(min-width:560px){.sn-schedule-overlay{align-items:center}.sn-schedule-modal{border-radius:28px}}@media(max-width:390px){.sn-schedule-overlay{padding:8px}.sn-schedule-modal{padding:15px}.sn-schedule-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app-shell">
    <main id="app"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-item" data-page="workouts"><span class="nav-icon">🏋</span><span>Workouts</span></button>
      <button class="nav-fab" id="quickStart" aria-label="Quick start">+</button>
      <button class="nav-item" data-page="progress"><span class="nav-icon">▥</span><span>Progress</span></button>
      <button class="nav-item" data-page="profile"><span class="nav-icon">◎</span><span>Profile</span></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js?v=schedule-editor-v10"></script>
  <script src="exercise-library-extra.js?v=schedule-editor-v10"></script>
  <script src="progress.js?v=schedule-editor-v10"></script>
  <script src="beginner-plan.js?v=schedule-editor-v10"></script>
  <script src="active-plan.js?v=schedule-editor-v10"></script>
  <script src="visual-assets.js?v=schedule-editor-v10"></script>

  <script>
    (() => {
      const WEEK = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
      let draft = {};
      let editableWorkouts = [];
      let pickingDay = null;

      function planStamp(workout){
        const match = String(workout?.id || "").match(/^starter-plan-(\d+)-/);
        return match ? Number(match[1]) : 0;
      }

      function currentPlanWorkouts(){
        const generated = state.customWorkouts.filter(w => w.beginnerGenerated && planStamp(w));
        if(!generated.length) return [];
        const newest = Math.max(...generated.map(planStamp));
        return generated.filter(w => planStamp(w) === newest);
      }

      function getEditableWorkouts(){
        const current = currentPlanWorkouts();
        return current.length ? current : state.customWorkouts;
      }

      function ensureButton(){
        if(state.page !== "workouts") return;
        const schedule = document.querySelector(".schedule-card");
        if(!schedule || document.getElementById("snEditSchedule")) return;
        const button = document.createElement("button");
        button.type = "button";
        button.id = "snEditSchedule";
        button.className = "sn-edit-schedule-card";
        button.innerHTML = `<span class="sn-edit-schedule-icon">✎</span><span class="sn-edit-schedule-copy"><strong>Edit my schedule</strong><span>Move workouts, change days, or add rest days.</span></span><span class="sn-edit-schedule-arrow">›</span>`;
        button.addEventListener("click", openEditor);
        const banner = document.querySelector(".active-plan-banner");
        if(banner) banner.insertAdjacentElement("afterend", button);
        else schedule.insertAdjacentElement("beforebegin", button);
        const sub = schedule.querySelector(".schedule-sub");
        if(sub) sub.textContent = "Use Edit my schedule to rearrange your week anytime.";
      }

      function buildDraft(){
        editableWorkouts = getEditableWorkouts();
        const ids = new Set(editableWorkouts.map(w => w.id));
        draft = {};
        WEEK.forEach(day => {
          const w = state.customWorkouts.find(item => ids.has(item.id) && (item.days || []).includes(day));
          draft[day] = w?.id || null;
        });
      }

      function openEditor(){
        buildDraft();
        pickingDay = null;
        const overlay = document.createElement("div");
        overlay.id = "snScheduleOverlay";
        overlay.className = "sn-schedule-overlay";
        overlay.innerHTML = `<div class="sn-schedule-modal"></div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener("click", e => { if(e.target === overlay) closeEditor(); });
        renderEditor();
      }

      function closeEditor(){ document.getElementById("snScheduleOverlay")?.remove(); }
      function workoutById(id){ return editableWorkouts.find(w => w.id === id) || null; }

      function renderEditor(){
        const modal = document.querySelector(".sn-schedule-modal");
        if(!modal) return;
        if(pickingDay){ renderPicker(pickingDay); return; }
        modal.innerHTML = `
          <div class="sn-schedule-top"><button class="sn-schedule-close" id="snCloseSchedule">×</button><div class="sn-schedule-kicker">YOUR WEEK</div><div></div></div>
          <h1>Edit your schedule.</h1>
          <p class="sn-schedule-sub">Tap any day to change its workout. You can move workouts around without rebuilding your plan.</p>
          <div class="sn-schedule-days">
            ${WEEK.map(day => {
              const w = workoutById(draft[day]);
              return `<button class="sn-schedule-row ${w ? "has-workout" : ""}" data-day="${day}"><span class="sn-day-box">${day.slice(0,3)}</span><span class="sn-row-copy"><strong>${w ? escapeHtml(w.name) : "Rest day"}</strong><span>${w ? `${w.exercises?.length || 0} exercises • ${escapeHtml(workoutMuscles(w))}` : "No workout scheduled"}</span></span><span class="sn-change">Change ›</span></button>`;
            }).join("")}
          </div>
          <div class="sn-schedule-actions"><button class="secondary" id="snCancelSchedule">Cancel</button><button class="primary" id="snSaveSchedule">Save schedule</button></div>`;
        document.getElementById("snCloseSchedule").onclick = closeEditor;
        document.getElementById("snCancelSchedule").onclick = closeEditor;
        document.getElementById("snSaveSchedule").onclick = saveSchedule;
        document.querySelectorAll("[data-day]").forEach(btn => btn.onclick = () => { pickingDay = btn.dataset.day; renderEditor(); });
      }

      function renderPicker(day){
        const modal = document.querySelector(".sn-schedule-modal");
        const currentId = draft[day];
        modal.innerHTML = `
          <div class="sn-schedule-top"><button class="sn-schedule-back" id="snBackSchedule">←</button><div class="sn-schedule-kicker">${day.toUpperCase()}</div><button class="sn-schedule-close" id="snCloseSchedule">×</button></div>
          <h1>Choose ${day}.</h1>
          <p class="sn-schedule-sub">Pick a workout or make this a rest day.</p>
          <div class="sn-schedule-picker">
            <button class="sn-picker-row ${!currentId ? "selected" : ""}" data-workout-id=""><span class="sn-day-box">☾</span><span class="sn-picker-copy"><strong>Rest day</strong><span>No workout scheduled</span></span><span class="sn-picker-check">${!currentId ? "✓" : ""}</span></button>
            ${editableWorkouts.map(w => `<button class="sn-picker-row ${currentId === w.id ? "selected" : ""}" data-workout-id="${escapeHtml(w.id)}"><span class="sn-day-box">🏋</span><span class="sn-picker-copy"><strong>${escapeHtml(w.name)}</strong><span>${w.exercises?.length || 0} exercises • ${escapeHtml(workoutMuscles(w))}</span></span><span class="sn-picker-check">${currentId === w.id ? "✓" : ""}</span></button>`).join("")}
          </div>
          <div class="sn-schedule-note">If you choose a workout that is already on another day, START/NOW automatically swaps the two days.</div>`;
        document.getElementById("snBackSchedule").onclick = () => { pickingDay = null; renderEditor(); };
        document.getElementById("snCloseSchedule").onclick = closeEditor;
        document.querySelectorAll("[data-workout-id]").forEach(btn => btn.onclick = () => chooseForDay(day, btn.dataset.workoutId || null));
      }

      function chooseForDay(day, workoutId){
        if(!workoutId){ draft[day] = null; pickingDay = null; renderEditor(); return; }
        const oldTarget = draft[day];
        const otherDay = WEEK.find(d => d !== day && draft[d] === workoutId);
        draft[day] = workoutId;
        if(otherDay) draft[otherDay] = oldTarget || null;
        pickingDay = null;
        renderEditor();
      }

      function saveSchedule(){
        const editableIds = new Set(editableWorkouts.map(w => w.id));
        state.customWorkouts = state.customWorkouts.map(w => editableIds.has(w.id) ? {...w, days:[]} : w);
        WEEK.forEach(day => {
          const id = draft[day];
          if(!id) return;
          const w = state.customWorkouts.find(item => item.id === id);
          if(w) w.days = [day];
        });
        saveCustomWorkouts();
        closeEditor();
        state.page = "workouts";
        render();
        if(typeof showToast === "function") showToast("Schedule updated");
      }

      const observer = new MutationObserver(() => ensureButton());
      observer.observe(document.getElementById("app"), {childList:true, subtree:true});
      setTimeout(ensureButton, 0);
    })();
  </script>
</body>
</html>
